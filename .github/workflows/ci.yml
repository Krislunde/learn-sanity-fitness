name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  SCHEMA_VALIDATION_REPORT: schema-report.txt
  DATASET_VALIDATION_REPORT: dataset-report.txt

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter ./apps/studio run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ./apps/studio run lint --max-warnings 0

  validate-schema:
    name: Validate Studio schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate Studio schema
        id: validate
        run: |
          set +e
          pnpm --filter ./apps/studio exec sanity schema validate > "$SCHEMA_VALIDATION_REPORT" 2>&1
          exit_code=$?
          set -e
          {
            echo "## Schema Validation Results"
            echo '```'
            cat "$SCHEMA_VALIDATION_REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code

      - name: Post schema validation report
        uses: actions/github-script@v7
        if: failure() && steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.SCHEMA_VALIDATION_REPORT, 'utf8');
            const body = [
              '### ❌ Schema validation failed',
              '',
              '```',
              report,
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  validate-dataset:
    name: Validate dataset
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate dataset
        id: validate
        run: |
          set +e
          pnpm --filter ./apps/studio exec sanity documents validate --yes --level info > "$DATASET_VALIDATION_REPORT" 2>&1
          exit_code=$?
          set -e
          {
            echo "## Dataset Validation Results"
            echo '```'
            cat "$DATASET_VALIDATION_REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code
        env:
          SANITY_ACTIVE_ENV: production
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Post dataset validation report
        if: failure() && steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.DATASET_VALIDATION_REPORT, 'utf8');
            const body = [
              '### ❌ Dataset validation failed',
              '',
              '```',
              report,
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
