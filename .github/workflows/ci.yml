name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/studio

env:
  SCHEMA_VALIDATION_REPORT: schema-report.txt
  DATASET_VALIDATION_REPORT: dataset-report.txt

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/studio/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/studio/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint --max-warnings 0

  validate-schema:
    name: Validate Studio schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/studio/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Validate Studio schema
        id: validate
        run: |
          set +e
          pnpm exec sanity schema validate >> "$SCHEMA_VALIDATION_REPORT" 2>&1
          exit_code=$?
          set -e
          {
            echo "## Schema Validation Results"
            echo '```'
            cat "$SCHEMA_VALIDATION_REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code

      - name: Post schema validation report
        uses: actions/github-script@v7
        if: failure() && steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('apps/studio/${{ env.SCHEMA_VALIDATION_REPORT }}', 'utf8');
            const body = [
                '### ❌ Schema validation failed',
                '',
                `\`\`\`${report}\`\`\``,
            ].join('\n');

            await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
            });

  validate-dataset:
    name: Validate dataset
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'development'))
      || github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/development'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/studio/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Validate dataset
        id: validate
        run: |
          set +e
          pnpm exec sanity documents validate --yes --level info >> "$DATASET_VALIDATION_REPORT" 2>&1
          exit_code=$?
          set -e
          {
            echo "## Dataset Validation Results"
            echo '```'
            cat "$DATASET_VALIDATION_REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code
        env:
          SANITY_ACTIVE_ENV: production
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}

      - name: Post dataset validation report
        if: failure() && steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('apps/studio/${{ env.DATASET_VALIDATION_REPORT }}', 'utf8');
            const body = [
                '### ❌ Dataset validation failed',
                '',
                `\`\`\`${report}\`\`\``,
            ].join('\n');

            await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
            });

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint --max-warnings 0

  web-typecheck:
    name: Web Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck
